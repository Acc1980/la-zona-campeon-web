<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portada N3 Mediocampista</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 600px; height: 600px; overflow: hidden; }

    .cover {
      width: 600px;
      height: 600px;
      background: linear-gradient(160deg, #1a1a2e 0%, #2c2f3a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      position: relative;
      border-bottom: 4px solid #C8AA32;
    }

    .cover-logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C8AA32;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .cover-tag {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #C8AA32;
      background: rgba(200, 170, 50, 0.12);
      border: 1px solid rgba(200, 170, 50, 0.35);
      padding: 6px 18px;
      border-radius: 30px;
      margin-bottom: 22px;
    }

    .cover h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 38px;
      line-height: 1.1;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .cover h1 span { color: #C8AA32; }

    .cover-sub {
      font-family: 'Open Sans', sans-serif;
      font-size: 13px;
      color: #9090b0;
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .gold-line {
      width: 50px;
      height: 3px;
      background: #C8AA32;
      margin: 0 auto 22px;
    }

    .cover-promise {
      background: rgba(200, 170, 50, 0.1);
      border: 1px solid rgba(200, 170, 50, 0.25);
      border-radius: 10px;
      padding: 16px 24px;
      max-width: 400px;
      font-family: 'Open Sans', sans-serif;
      font-size: 12px;
      color: #b0b0cc;
      line-height: 1.7;
      font-style: italic;
    }

    .cover-promise strong { color: #C8AA32; font-style: normal; }

    .nivel-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a1a2e;
      background: #C8AA32;
      padding: 5px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="nivel-badge">Nivel 3 — Fútbol</div>
    <div class="cover-logo">La Zona Campeón</div>
    <div class="cover-tag">Manual por Posición</div>
    <h1>Entrenamiento<br>Mental del<br><span>Mediocampista</span></h1>
    <div class="gold-line"></div>
    <div class="cover-sub">Técnicas, plan de 4 semanas y registro diario para dominar la mente en el centro del campo</div>
    <div class="cover-promise">
      <strong>Decisión · Concentración · Liderazgo</strong><br>
      Herramientas concretas para el desafío mental único de tu posición
    </div>
  </div>
</body>
</html>
